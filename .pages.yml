media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: site_settings
    label: Profile, Contact & CV
    type: file
    path: _data/site.yml
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: brand, label: Navigation brand, type: string, required: true }
      - { name: role, label: Professional headline, type: string, required: true }
      - { name: profile_image, label: Profile photo, type: image, required: true }
      - { name: bio, label: Biography, type: rich-text, required: true, description: "Select text in the editor and use the link button to add university, supervisor, or other hyperlinks." }
      - { name: email, label: Email, type: string, required: true }
      - { name: phone, label: Phone, type: string, required: true }
      - { name: location, label: Location, type: string, required: true }
      - { name: linkedin, label: LinkedIn URL, type: string, required: false }
      - { name: researchgate, label: ResearchGate URL, type: string, required: false }
      - { name: orcid, label: ORCID URL, type: string, required: false }
      - { name: cv_label, label: CV filename/label, type: string, required: true }
      - { name: cv_url, label: CV link, type: string, required: true }
      - { name: research_interests, label: Research interests, type: string, list: true, required: true }
      - { name: supervision, label: Supervision note, type: text, required: true }

  - name: highlights
    label: Featured Highlights
    type: collection
    path: _highlights
    filename: "{fields.slug}.md"
    view:
      fields: [image, title, subtitle, order]
      primary: title
      sort: [order, title]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: URL name, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      - { name: subtitle, label: Subtitle, type: string, required: true }
      - { name: image, label: Image, type: image, required: true }
      - { name: order, label: Display order, type: number, required: true }
      - { name: body, label: Detail page content, type: rich-text, required: false }

  - name: qualifications
    label: Qualifications
    type: collection
    path: _qualifications
    filename: "{fields.slug}.md"
    view:
      fields: [title, period, institution, order]
      primary: title
      sort: [order, title]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Degree / qualification, type: string, required: true }
      - { name: slug, label: URL name, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      - { name: period, label: Study period, type: string, required: true }
      - { name: institution, label: Institution, type: string, required: true }
      - { name: order, label: Display order, type: number, required: true }
      - { name: body, label: Details, type: rich-text, required: false }

  - name: research
    label: Research Publications
    type: collection
    path: _research
    filename: "{fields.slug}.md"
    view:
      fields: [title, venue, status, date]
      primary: title
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Publication title, type: string, required: true }
      - { name: slug, label: URL name, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      - { name: date, label: Publication date, type: date, required: true }
      - { name: venue, label: Journal / venue details, type: string, required: true }
      - { name: status, label: Status, type: string, required: false }
      - { name: authors, label: Authors, type: string, required: true }
      - { name: doi_url, label: DOI or publication link, type: string, required: false }
      - { name: body, label: Abstract / details, type: rich-text, required: false }

  - name: experiences
    label: Experience
    type: collection
    path: _experiences
    filename: "{fields.slug}.md"
    view:
      fields: [title, organization, period, order]
      primary: title
      sort: [order, title]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Position, type: string, required: true }
      - { name: slug, label: URL name, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      - { name: period, label: Employment period, type: string, required: true }
      - { name: organization, label: Organization, type: string, required: true }
      - { name: order, label: Display order, type: number, required: true }
      - { name: body, label: Role details, type: rich-text, required: false }

  - name: certificates
    label: Certificates & Achievements
    type: collection
    path: _certificates
    filename: "{fields.slug}.md"
    view:
      fields: [image, title, issuer, category, display_date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: URL name, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      - name: category
        label: Group
        type: select
        required: true
        options:
          values: [Courses, Achievements / Trainings]
      - { name: issuer, label: Issuer / organization, type: string, required: true }
      - { name: date, label: Date (for sorting), type: date, required: true }
      - { name: display_date, label: Date shown on site, type: string, required: true, description: "Example: 17 March 2026" }
      - { name: image, label: Certificate image, type: image, required: true }
      - { name: document, label: Certificate PDF, type: file, required: false }
      - { name: body, label: Description, type: rich-text, required: false }

  - name: galleries
    label: Gallery Albums
    type: collection
    path: _galleries
    filename: "{fields.slug}.md"
    view:
      fields: [cover_image, title, display_date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Album title, type: string, required: true }
      - { name: slug, label: URL name, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      - { name: summary, label: Short summary, type: string, required: true }
      - { name: date, label: Date (for sorting), type: date, required: true }
      - { name: display_date, label: Date shown on site, type: string, required: true, description: "Example: June 2026" }
      - { name: cover_image, label: Cover image, type: image, required: true }
      - name: images
        label: Album photos
        type: image
        required: true
        list:
          min: 1
        options:
          unique: true
          rename: true
      - { name: body, label: Album story, type: rich-text, required: false }

  - name: pages
    label: Extra Pages
    type: collection
    path: _pages
    filename: "{fields.slug}.md"
    view:
      fields: [title, updated]
      primary: title
      sort: [title]
    fields:
      - { name: title, label: Page title, type: string, required: true }
      - { name: slug, label: URL name, type: string, required: true, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
      - { name: updated, label: Last updated, type: date, required: true }
      - { name: hero_image, label: Header image, type: image, required: false }
      - { name: body, label: Page content, type: rich-text, required: true }
