bio: I completed my MS in Computer Science from [COMSATS University Islamabad
  (CUI)](https://www.comsats.edu.pk/), under the supervision of [Prof. Dr.
  Nadeem Javaid](https://www.njavaid.com/). My research interests include
  Artificial Intelligence, Machine Learning, Data Analytics, Medical Imaging,
  Pattern Recognition and Healthcare Applications. I am currently serving as a
  Lecturer in the Department of Computing and Intelligent Systems at [University
  of Rawalpindi (UOR)](https://www.uor.edu.pk/), Rawalpindi, Pakistan.
