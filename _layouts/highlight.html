---
layout: content
---
<article class="detail-article wrap">
  <p class="eyebrow">Featured Highlight</p>
  <h1>{{ page.title }}</h1>
  <p class="detail-lead">{{ page.subtitle }}</p>
  <img class="page-hero-image" src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}">
  <div class="prose">{{ content }}</div>
</article>
